services:
  edge:
    build:
      context: .
      dockerfile: docker/openresty/Dockerfile
    depends_on:
      php:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      - postgres
      - valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "1"
      RUN_FIRST_BOOTSTRAP: "1"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_started
      php:
        condition: service_healthy
    working_dir: /var/www/html
    command: sh -lc "su-exec www-data:www-data php artisan schedule:clear-cache || true; su-exec www-data:www-data php artisan schedule:work"
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "0"
      RUN_FIRST_BOOTSTRAP: "0"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi; tail -f /dev/null"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shortener}
      POSTGRES_USER: ${DB_USERNAME:-shortener}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shortener}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
  vendor:
  node_modules:
  storage_data:
  bootstrap_cache:
